<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>مُداشاپ - آفلاین</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f0e8;
      color: #221d1b;
      font-family: Tahoma, sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 360px;
    }
    h1 {
      color: #7a2e3a;
      font-size: 1.25rem;
      margin-bottom: 8px;
    }
    p {
      color: #8a7f78;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    button {
      margin-top: 16px;
      background: #7a2e3a;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 999px;
      font-size: 0.9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>مُداشاپ</h1>
    <p>در حال حاضر به اینترنت متصل نیستید. لطفاً اتصال خود را بررسی کنید و دوباره تلاش کنید.</p>
    <button onclick="location.reload()">تلاش دوباره</button>
  </div>
</body>
</html>
